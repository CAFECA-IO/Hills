[workspace]
resolver = "3"
members = [
  "crates/*",
  "apps/mailbox",
  "apps/tsa",
  "apps/storage",
  "apps/desktop/src-tauri",
  "poc/net-echo",
  "poc/automerge-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/CAFECA-IO/hills.cafeca.io"
rust-version = "1.91"
publish = false

[workspace.dependencies]
# 內部 crate
hills-proto = { path = "crates/hills-proto" }
hills-identity = { path = "crates/hills-identity" }
hills-crypto = { path = "crates/hills-crypto" }
hills-store = { path = "crates/hills-store" }
hills-sync = { path = "crates/hills-sync" }
hills-net = { path = "crates/hills-net" }
hills-domain = { path = "crates/hills-domain" }
hills-node = { path = "crates/hills-node" }
hills-cafeca = { path = "crates/hills-cafeca" }

# 通用
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde_bytes = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# 密碼學（僅限 technical-design §2 列出的函式庫）
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
argon2 = "0.6"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
# CAFECA 登入（technical-design §2、§17）：EIP-712、中繼回應解密、鏈上查詢
alloy-sol-types = { version = "1.7", default-features = false, features = ["std"] }
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "std"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# 網路與同步
iroh = "1"
iroh-gossip = "0.102"
n0-future = "0.3"
bytes = "1"
automerge = "0.12"
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }

# 桌機 app
keyring = "4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# 測試
proptest = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
