# 依賴授權與來源檢查（development-guidelines §6：與 MIT 相容的授權）
[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
ignore = [
  # 皆為「停止維護」通知、非安全漏洞，且只是上游的編譯期 proc-macro；上游更新後移除。
  { id = "RUSTSEC-2024-0436", reason = "paste：經 iroh → netwatch → netlink-packet-core 引入" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error：經 tauri → gtk 0.18（Linux）引入" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names：經 keyring → Linux Secret Service（zbus 5）引入；已併入 zbus 6，上游升級後移除" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant：同上" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive：同上" },
]
