# Hills 自架服務：relay + mailbox + storage-0…7。technical-design §10、§15.6–15.7、§16.9；步驟見 docs/deploy.md。
# tsa 隨假勤功能加入。
# 8 個儲存節點共用的設定（D39：iroh 連線、各自獨立 volume 與 UDP 埠，不需網域或憑證）
x-storage-env: &storage-env
  HILLS_RELAY: https://${HILLS_RELAY_HOST:?請在 .env 設定 HILLS_RELAY_HOST}
  HILLS_STORAGE_CODES_DIR: /storage-codes
  HILLS_ORG_ROOT_PUB: ${HILLS_ORG_ROOT_PUB:-}
  HILLS_QUOTA_BYTES: ${HILLS_QUOTA_BYTES:-21474836480}
  RUST_LOG: info,iroh=warn

x-storage: &storage
  build:
    context: ..
    dockerfile: apps/storage/Dockerfile
  image: hills-storage:local
  restart: unless-stopped
  depends_on:
    - relay

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    ports:
      - "80:80" # HTTP（LetsEncrypt 驗證）
      - "443:443" # HTTPS relay
      - "7842:7842/udp" # QUIC address discovery
    # 設定由 relay-entrypoint.sh 依環境變數產生，不掛載主機檔案（docs/deploy.md §2）
    environment:
      HILLS_RELAY_HOST: ${HILLS_RELAY_HOST:?請在 .env 設定 HILLS_RELAY_HOST}
      HILLS_RELAY_CONTACT: ${HILLS_RELAY_CONTACT:?請在 .env 設定 HILLS_RELAY_CONTACT}
    volumes:
      - relay-data:/data

  mailbox:
    build:
      context: ..
      dockerfile: apps/mailbox/Dockerfile
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      HILLS_RELAY: https://${HILLS_RELAY_HOST:?請在 .env 設定 HILLS_RELAY_HOST}
      HILLS_PUBLIC_ADDR: ${HILLS_PUBLIC_IP:?請在 .env 設定 HILLS_PUBLIC_IP}:${HILLS_UDP_PORT:-7843}
      HILLS_UDP_PORT: ${HILLS_UDP_PORT:-7843}
      HILLS_ORG_ROOT_PUB: ${HILLS_ORG_ROOT_PUB:-}
      HILLS_STORAGE_CODES_DIR: /storage-codes
      RUST_LOG: info,iroh=warn
    ports:
      - "${HILLS_UDP_PORT:-7843}:${HILLS_UDP_PORT:-7843}/udp"
      # 健康檢查只對本機開放；主機埠可用 HILLS_HEALTH_PORT 修改（避免與主機上其他服務衝突）
      - "127.0.0.1:${HILLS_HEALTH_PORT:-18080}:8080"
    volumes:
      - mailbox-data:/data
      - storage-codes:/storage-codes:ro

  storage-0:
    <<: *storage
    environment:
      <<: *storage-env
      HILLS_NODE_INDEX: "0"
      HILLS_UDP_PORT: ${HILLS_STORAGE_PORT_0:-7850}
      HILLS_PUBLIC_ADDR: ${HILLS_PUBLIC_IP:?請在 .env 設定 HILLS_PUBLIC_IP}:${HILLS_STORAGE_PORT_0:-7850}
    ports:
      - "${HILLS_STORAGE_PORT_0:-7850}:${HILLS_STORAGE_PORT_0:-7850}/udp"
    volumes:
      - storage-0-data:/data
      - storage-codes:/storage-codes

  storage-1:
